services:
  postgres:
    image: postgres:16-alpine
    container_name: ambar-postgres
    environment:
      POSTGRES_USER: ambar
      POSTGRES_PASSWORD: ambar_local
      POSTGRES_DB: ambar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambar -d ambar"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
